<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>T-Shirt Payment</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!-- iOS Dynamic Background -->
    <div class="ios-bg">
        <div class="gradient-blob blob-1"></div>
        <div class="gradient-blob blob-2"></div>
        <div class="gradient-blob blob-3"></div>
    </div>
    
    <!-- Toast Notification -->
    <div id="toast" class="ios-toast">Please fill all fields</div>

    <div class="mobile-container">
        <header class="ios-header">
            <div class="logo-container">
                <img src="logo.png" alt="Logo" class="institute-logo" onerror="this.style.display='none'; this.parentElement.style.display='none';">
            </div>
            <h1 class="inst-title">Al-Ameen</h1>
            <h2 class="inst-subtitle">Mission Academy Nayabaz</h2>
            <div class="form-context-badge">T-Shirt Payment Collection</div>
        </header>

        <main class="ios-main">
            <div class="ios-card">
                <form id="dataForm">
                    <div class="input-group">
                        <label for="roomNumber">Room</label>
                        <input type="number" id="roomNumber" inputmode="numeric" pattern="[0-9]*" placeholder="e.g. 101" required>
                    </div>

                    <div class="input-group">
                        <label for="className">Class</label>
                        <select id="className" required>
                            <option value="" disabled selected hidden>Select Class</option>
                            <option value="XI-NEET">XI-NEET</option>
                            <option value="XI-IIT">XI-IIT</option>
                        </select>
                        <div class="select-arrow">
                            <svg width="12" height="8" viewBox="0 0 12 8" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M1 1.5L6 6.5L11 1.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                    </div>

                    <div class="row-group">
                        <div class="input-group half">
                            <label for="bedCount">Total Beds</label>
                            <input type="number" id="bedCount" inputmode="numeric" pattern="[0-9]*" min="0" placeholder="0" required>
                        </div>
                        <div class="input-group half">
                            <label for="studentCount">Students</label>
                            <input type="number" id="studentCount" inputmode="numeric" pattern="[0-9]*" min="0" placeholder="0" required>
                        </div>
                    </div>
                </form>
            </div>

            <!-- iOS Widgets Style -->
            <div class="widgets-container">
                <div class="ios-widget widget-small">
                    <div class="widget-icon blue">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    </div>
                    <span class="widget-label">Vacant Beds</span>
                    <span class="widget-value" id="vacantBeds">0</span>
                </div>
                
                <div class="ios-widget widget-large">
                    <div class="widget-header">
                        <div class="widget-icon green" style="font-size: 18px; font-weight: 700;">
                            ₹
                        </div>
                        <span class="widget-label">Payable Amount</span>
                    </div>
                    <span class="widget-value highlight">₹<span id="totalAmount">0</span></span>
                    <span class="widget-subtext">₹400 / student</span>
                </div>
            </div>

            <!-- iMessage Bubble Preview -->
            <div class="imessage-container">
                <p class="imessage-timestamp">Preview</p>
                <div class="imessage-bubble" id="messagePreview">
                    <!-- Text will go here -->
                </div>
            </div>
        </main>

        <!-- Sticky Bottom Area -->
        <div class="bottom-action">
            <button id="whatsappBtn" class="ios-btn-primary">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.086 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
                Send via WhatsApp
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
